<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eff9">
<title>Tests | Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e9eff9;--bg2:#f6f8fc;--card:#fff;--text:#0f1b3d;--muted:#6a7897;--line:#e1e8f4;--blue:#2b5fd9;--blue-soft:rgba(43,95,217,.11);--green:#12a56a;--red:#d6455d;--orange:#e69a1a;--purple:#6d5bd0;--teal:#0e9aa7;--shadow:0 8px 26px rgba(20,40,110,.09)}
@media(prefers-color-scheme:dark){:root{--bg1:#0e1630;--bg2:#141d3d;--card:#1a2547;--text:#eaf0ff;--muted:#9fb0d6;--line:#2a3862;--blue:#7ea4ff;--blue-soft:rgba(126,164,255,.17);--green:#4fd69c;--red:#ff7b8f;--orange:#ffc25c;--purple:#a99bff;--teal:#4fd1d9;--shadow:0 10px 28px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{min-height:100vh;color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;padding:24px 14px 110px}
body:before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 32% at 12% 8%,rgba(90,130,255,.2),transparent 70%),radial-gradient(36% 30% at 92% 30%,rgba(120,200,230,.18),transparent 70%)}
.app{max-width:860px;margin:auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);font-size:22px;text-decoration:none;box-shadow:var(--shadow)}
.heading{flex:1;min-width:0}h1{font-size:clamp(1.35rem,5vw,1.8rem);font-weight:800}.muted{color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#4f86ff,#2548b8);font-weight:800}
.hero{background:linear-gradient(120deg,#17327f,#2552c8 58%,#3f7bff);color:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 14px 34px rgba(37,72,184,.25);overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-55px;top:-90px;background:#ffffff13}
.hero small{color:#ffffffbf;font-weight:600;font-size:.82rem}.hero h2{font-size:clamp(1.25rem,5vw,1.7rem);margin:6px 0;overflow-wrap:anywhere}.hero p{color:#ffffffd6;font-size:.9rem;line-height:1.5}
.hero .when{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:99px;background:#ffffff26;font-weight:800;font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.stat{padding:15px;min-width:0}.stat b{font-size:1.5rem;display:block}.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.panel{padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:6px;background:var(--blue-soft);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--blue);font:700 .88rem Inter;padding:11px 8px;border-radius:10px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--blue);color:#fff}
.subjects{display:flex;gap:8px;overflow:auto;padding:0 1px 14px;scrollbar-width:thin}
.pill{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:var(--card);color:var(--muted);font:600 .82rem Inter;cursor:pointer}
.pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sectionhead h2{font-size:1.05rem;font-weight:800}.count{font-size:.8rem;color:var(--muted);font-weight:600}
.test{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line)}.test:first-child{border-top:0;padding-top:0}.test:last-child{padding-bottom:0}
.ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:800;font-size:1.05rem;background:var(--blue-soft);color:var(--blue)}
.ti.done{background:rgba(18,165,106,.14);color:var(--green)}.ti.wait{background:rgba(230,154,26,.15);color:var(--orange)}
.tb{flex:1;min-width:0}.tb h3{font-size:.96rem;line-height:1.35;overflow-wrap:anywhere;margin-bottom:5px}.tb p{font-size:.8rem;color:var(--muted);line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:.7rem;font-weight:700;padding:5px 8px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.tag.soon{background:rgba(230,154,26,.15);color:var(--orange)}.tag.today{background:rgba(214,69,93,.13);color:var(--red)}
.score{text-align:right;flex:none}.score b{display:block;font-size:1.15rem}.score small{font-size:.74rem;font-weight:700;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--blue-soft);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.g{color:var(--green)}.o{color:var(--orange)}.r{color:var(--red)}
.empty{text-align:center;padding:32px 14px;color:var(--muted);font-size:.9rem;line-height:1.5}.empty .emoji{font-size:2rem;margin-bottom:8px}.empty h3{color:var(--text);font-size:1rem;margin-bottom:5px}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.84rem;line-height:1.5;background:rgba(214,69,93,.1);border:1px solid var(--red)}
nav{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:10px;width:min(680px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:8px;border-radius:26px;background:linear-gradient(135deg,#1c2d5a,#2b4691);box-shadow:0 14px 34px rgba(20,35,90,.38)}
nav a{display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:17px;color:#ffffffc9;text-decoration:none;font-size:.66rem;font-weight:700;text-align:center}
nav a.active{background:#fff;color:#1f3f9e}
@media(max-width:480px){body{padding-top:16px}.stats{gap:7px}.stat{padding:12px 10px}.stat b{font-size:1.25rem}.panel{padding:14px}.ti{width:42px;height:42px}nav a{font-size:.59rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="dashboard.html" aria-label="Back to dashboard">‹</a>
    <div class="heading"><h1>Tests</h1><p class="muted" style="font-size:.84rem;margin-top:4px">Tests set for your class and your results</p></div>
    <div class="avatar" id="avatar">S</div>
  </header>

  <div class="alert" id="err" role="alert" hidden></div>

  <section class="hero">
    <small id="heroLbl">Next test</small>
    <h2 id="heroTitle">Loading…</h2>
    <p id="heroSub"></p>
    <span class="when" id="heroWhen" hidden></span>
  </section>

  <section class="stats" aria-label="Test summary">
    <div class="stat"><b id="upCount">—</b><span>Upcoming</span></div>
    <div class="stat"><b id="doneCount">—</b><span>Results received</span></div>
    <div class="stat"><b id="avgScore">—</b><span>Average score</span></div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist"><button class="on" id="tabUp" role="tab" type="button">Upcoming</button><button id="tabDone" role="tab" type="button">Results</button></div>
    <div class="subjects" id="subjects"></div>
    <div class="sectionhead"><h2 id="listTitle">Upcoming tests</h2><span class="count" id="listCount"></span></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </section>
</div>

<nav aria-label="Main navigation">
  <a href="dashboard.html">⌂<span>Home</span></a>
  <a href="attendance.html">▦<span>Attendance</span></a>
  <a href="fees.html">₹<span>Fees</span></a>
  <a href="study-materials.html">▤<span>Materials</span></a>
  <a class="active" href="tests.html" aria-current="page">▣<span>Tests</span></a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Keep this config identical to dashboard.html. */
const firebaseConfig = {
  apiKey: "AIzaSyDbxUTsBSeFIevnbJadEHkubyKBRHdDM94",
  authDomain: "geniusinstitute-unnao.firebaseapp.com",
  projectId: "geniusinstitute-unnao",
  storageBucket: "geniusinstitute-unnao.firebasestorage.app",
  messagingSenderId: "457602291145",
  appId: "1:457602291145:web:678518a46dd475dd540418",
  measurementId: "G-10RZJQMHR7"
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (d) => d.toLocaleDateString("en-IN", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
const todayMid = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

let tests = [], mode = "up", subject = "all", uid = "";

/* A test written by the admin or a teacher: { name, subject, class, date, max, marks:{uid:score}, byName?, time?, topics? } */
function normalize(id, v) {
  let date = null;
  if (v.date && v.date.toDate) date = v.date.toDate(); else if (v.date) { date = new Date(String(v.date).length <= 10 ? v.date + "T00:00:00" : v.date); }
  if (date && isNaN(date)) date = null;
  const max = Number(v.max) || 0, raw = v.marks && v.marks[uid] !== undefined && v.marks[uid] !== null && v.marks[uid] !== "" ? Number(v.marks[uid]) : null;
  return { id, name:v.name || v.title || "Untitled test", subject:v.subject || "General", date, max, score:raw, by:v.byName || "", time:v.time || "", topics:v.topics || v.syllabus || v.description || "" };
}
const dayDiff = (d) => Math.round((d - todayMid) / 864e5);
function whenLabel(d) {
  const n = dayDiff(d); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n > 1 ? "In " + n + " days" : Math.abs(n) === 1 ? "Yesterday" : Math.abs(n) + " days ago";
}
const isUpcoming = (t) => t.score === null && t.date && t.date >= todayMid;
const isResult = (t) => t.score !== null;
const gradeClass = (p) => (p >= 75 ? "g" : p >= 40 ? "o" : "r");
function showError(m) { $("err").textContent = m; $("err").hidden = false; }

function renderHero() {
  const next = tests.filter(isUpcoming).sort((a, b) => a.date - b.date)[0];
  if (!next) { $("heroLbl").textContent = "Tests"; $("heroTitle").textContent = "No upcoming tests"; $("heroSub").textContent = "When your teacher schedules a test for your class, it will appear here."; $("heroWhen").hidden = true; return; }
  $("heroLbl").textContent = "Next test"; $("heroTitle").textContent = next.name;
  $("heroSub").textContent = next.subject + " · " + fmt(next.date) + (next.time ? " · " + next.time : "") + (next.max ? " · Maximum marks " + next.max : "");
  $("heroWhen").textContent = whenLabel(next.date); $("heroWhen").hidden = false;
}
function renderStats() {
  const done = tests.filter(isResult), withMax = done.filter((t) => t.max > 0);
  $("upCount").textContent = tests.filter(isUpcoming).length; $("doneCount").textContent = done.length;
  $("avgScore").textContent = withMax.length ? Math.round(withMax.reduce((a, t) => a + t.score / t.max * 100, 0) / withMax.length) + "%" : "—";
}
function renderList() {
  const base = tests.filter(mode === "up" ? isUpcoming : (t) => isResult(t) || (t.date && t.date < todayMid));
  const subs = [...new Set(base.map((t) => t.subject))].sort();
  if (subject !== "all" && !subs.includes(subject)) subject = "all";
  $("subjects").hidden = subs.length < 2;
  $("subjects").innerHTML = ['<button class="pill ' + (subject === "all" ? "active" : "") + '" data-s="all" type="button">All subjects</button>'].concat(subs.map((s) => `<button class="pill ${subject === s ? "active" : ""}" data-s="${esc(s)}" type="button">${esc(s)}</button>`)).join("");
  const list = base.filter((t) => subject === "all" || t.subject === subject).sort((a, b) => mode === "up" ? a.date - b.date : (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0));
  $("listTitle").textContent = mode === "up" ? "Upcoming tests" : "Your results"; $("listCount").textContent = list.length + (list.length === 1 ? " test" : " tests");
  if (!list.length) {
    $("list").innerHTML = mode === "up" ? '<div class="empty"><div class="emoji">🎉</div><h3>No upcoming tests</h3><p>You are all caught up. New tests will show up here.</p></div>'
      : '<div class="empty"><div class="emoji">📝</div><h3>No results yet</h3><p>Your marks will appear here once your teacher enters them.</p></div>'; return;
  }
  $("list").innerHTML = list.map((t) => {
    const dateTxt = t.date ? fmt(t.date) : "Date to be announced";
    if (mode === "up") {
      const n = t.date ? dayDiff(t.date) : 99, tag = n === 0 ? '<span class="tag today">Today</span>' : n <= 3 ? '<span class="tag soon">' + esc(whenLabel(t.date)) + "</span>" : '<span class="tag">' + esc(whenLabel(t.date)) + "</span>";
      return `<article class="test"><div class="ti">${esc(t.subject.charAt(0).toUpperCase())}</div><div class="tb"><h3>${esc(t.name)}</h3><p>${esc(t.subject)} · ${esc(dateTxt)}${t.time ? " · " + esc(t.time) : ""}</p>
        ${t.topics ? `<p style="margin-top:4px">${esc(t.topics)}</p>` : ""}<div class="tags">${tag}${t.max ? `<span class="tag">Maximum marks ${t.max}</span>` : ""}${t.by ? `<span class="tag">By ${esc(t.by)}</span>` : ""}</div></div></article>`;
    }
    if (t.score === null) return `<article class="test"><div class="ti wait">…</div><div class="tb"><h3>${esc(t.name)}</h3><p>${esc(t.subject)} · ${esc(dateTxt)}</p><div class="tags"><span class="tag soon">Result awaited</span></div></div></article>`;
    const p = t.max ? Math.round(t.score / t.max * 100) : null;
    return `<article class="test"><div class="ti done">${esc(t.subject.charAt(0).toUpperCase())}</div><div class="tb"><h3>${esc(t.name)}</h3><p>${esc(t.subject)} · ${esc(dateTxt)}</p>
      ${p !== null ? `<div class="bar" aria-hidden="true"><i style="width:${Math.min(p, 100)}%"></i></div>` : ""}</div>
      <div class="score"><b class="${p !== null ? gradeClass(p) : ""}">${t.score}${t.max ? " / " + t.max : ""}</b><small>${p !== null ? p + "%" : ""}</small></div></article>`;
  }).join("");
}

$("tabUp").addEventListener("click", () => { mode = "up"; $("tabUp").classList.add("on"); $("tabDone").classList.remove("on"); renderList(); });
$("tabDone").addEventListener("click", () => { mode = "done"; $("tabDone").classList.add("on"); $("tabUp").classList.remove("on"); renderList(); });
$("subjects").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b) { subject = b.dataset.s; renderList(); } });

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace("login.html"); return; }
  uid = user.uid;
  try {
    const snap = await getDoc(doc(db, "students", user.uid));
    if (!snap.exists()) { showError("No student profile was found for this account (students/" + user.uid + ")."); $("list").innerHTML = ""; $("heroTitle").textContent = "Tests"; return; }
    const s = snap.data();
    if (s.blocked) { await signOut(auth); location.replace("login.html#blocked"); return; }
    $("avatar").textContent = (String(s.name || s.studentName || "S").trim().charAt(0) || "S").toUpperCase();
    const cls = String(s.class ?? "").trim();
    if (!cls) { showError("Your class is not set yet, so tests cannot be shown. Please contact the office."); $("list").innerHTML = ""; $("heroTitle").textContent = "Tests"; return; }
    const res = await getDocs(query(collection(db, "tests"), where("class", "==", cls)));
    tests = res.docs.map((d) => normalize(d.id, d.data()));
    renderHero(); renderStats(); renderList();
  } catch (e) {
    showError("Could not load tests (" + (e.code || e.message) + "). Check your Firestore rules.");
    $("list").innerHTML = ""; $("heroTitle").textContent = "Tests";
  }
});
</script>
</body>
</html>
