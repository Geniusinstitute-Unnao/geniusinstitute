<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<style>
  :root {
    --bg: #e6e9fb;
    --clay: #7c8cff;
    --clay-light: #a9b4ff;
    --clay-dark: #5566e0;
    --accent: #ffb38a;
    --text: #2d3270;
    --muted: #6a70a8;
    --err: #d9455f;
    --ok: #2e9e6b;
    --shadow-dark: rgba(85, 102, 224, .38);
    --shadow-light: rgba(255, 255, 255, .95);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d2040;
      --clay: #6f7fff;
      --clay-light: #9aa6ff;
      --clay-dark: #3b49b8;
      --accent: #ff9f72;
      --text: #e8ebff;
      --muted: #a3a9e0;
      --err: #ff7a90;
      --ok: #5fd9a0;
      --shadow-dark: rgba(8, 10, 35, .7);
      --shadow-light: rgba(120, 135, 255, .22);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    position: relative;
    overflow-x: hidden;
  }
  .blob {
    position: fixed; border-radius: 50%; background: var(--clay-light);
    box-shadow: inset -12px -12px 24px var(--shadow-dark), inset 12px 12px 24px var(--shadow-light);
    opacity: .85; pointer-events: none;
  }
  .b1 { width: 18vmin; height: 18vmin; top: 6%; left: 5%; }
  .b2 { width: 12vmin; height: 12vmin; bottom: 8%; right: 6%; background: var(--accent); }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    background: var(--bg);
    border-radius: 36px;
    padding: clamp(24px, 6vw, 40px);
    box-shadow: 18px 20px 40px var(--shadow-dark), -14px -14px 30px var(--shadow-light),
                inset 4px 4px 10px var(--shadow-light), inset -4px -4px 10px rgba(85,102,224,.12);
    animation: rise .6s cubic-bezier(.34, 1.56, .64, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.95); } to { opacity: 1; transform: none; } }

  .badge {
    width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 32%;
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: 8px 10px 18px var(--shadow-dark), -6px -6px 14px var(--shadow-light),
                inset -5px -6px 10px var(--clay-dark), inset 5px 6px 10px rgba(255,255,255,.45);
    display: grid; place-items: center;
  }
  .badge svg { width: 56%; height: 56%; filter: drop-shadow(2px 3px 2px rgba(40,50,140,.45)); }

  h1 { text-align: center; font-size: clamp(1.4rem, 5vw, 1.8rem); font-weight: 900; }
  .sub { text-align: center; color: var(--muted); font-size: .95rem; margin: 6px 0 22px; }

  form { display: grid; gap: 16px; }
  .field { display: grid; gap: 6px; }
  label { font-weight: 800; font-size: .88rem; padding-left: 6px; }
  input, select {
    width: 100%; font: inherit; color: var(--text);
    border: 0; outline: 0; border-radius: 18px; padding: 14px 16px;
    background: var(--bg);
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    transition: box-shadow .2s;
    min-height: 48px;
  }
  input::placeholder { color: var(--muted); opacity: .7; }
  input:focus-visible, select:focus-visible { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light), 0 0 0 3px var(--clay); }
  input[aria-invalid="true"], select[aria-invalid="true"] { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light), 0 0 0 2px var(--err); }
  .hint { font-size: .78rem; color: var(--muted); padding-left: 6px; }
  fieldset.subjects { border: 0; min-width: 0; display: grid; gap: 8px; }
  fieldset.subjects legend { font-weight: 800; font-size: .88rem; padding: 0 0 8px 6px; float: left; width: 100%; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; clear: both; }
  .chip { position: relative; display: block; cursor: pointer; padding: 0; font-weight: 800; }
  .chip input {
    position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; opacity: 0; cursor: pointer; margin: 0;
  }
  .chip span {
    display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 14px; border-radius: 18px;
    background: var(--bg); font-size: .92rem;
    box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
    transition: box-shadow .2s, background .2s, color .2s;
  }
  .chip span::before {
    content: ""; flex: none; width: 20px; height: 20px; border-radius: 7px; background: var(--bg);
    box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    display: grid; place-items: center; font-size: 13px; color: #fff; line-height: 1;
  }
  .chip input:checked + span {
    background: linear-gradient(145deg, var(--clay-light), var(--clay)); color: #fff;
    text-shadow: 1px 1px 2px rgba(40,50,140,.5);
    box-shadow: inset 4px 4px 8px var(--clay-dark), inset -3px -3px 8px rgba(255,255,255,.35);
  }
  .chip input:checked + span::before { content: "\2713"; background: var(--accent); box-shadow: 2px 2px 4px rgba(40,50,140,.4); }
  .chip input:focus-visible + span { outline: 3px solid var(--text); outline-offset: 2px; }
  fieldset.subjects[aria-invalid="true"] .chip span { box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light), 0 0 0 2px var(--err); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

  button.primary {
    margin-top: 6px; font: inherit; font-weight: 900; font-size: 1.05rem; color: #fff;
    border: 0; cursor: pointer; border-radius: 22px; padding: 15px; min-height: 52px;
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: 8px 10px 18px var(--shadow-dark), -6px -6px 14px var(--shadow-light),
                inset -4px -5px 10px var(--clay-dark), inset 4px 5px 10px rgba(255,255,255,.4);
    text-shadow: 1px 2px 2px rgba(40,50,140,.5);
    transition: transform .15s, box-shadow .15s;
  }
  button.primary:hover { transform: translateY(-2px); }
  button.primary:active { transform: translateY(1px); box-shadow: 3px 4px 8px var(--shadow-dark), inset 4px 5px 10px var(--clay-dark); }
  button.primary:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

  .switch { text-align: center; margin-top: 20px; font-size: .95rem; color: var(--muted); }
  .switch a { color: var(--clay-dark); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .switch a { color: var(--clay-light); } }
  .switch a:focus-visible { outline: 3px solid var(--clay); border-radius: 6px; }

  .msg { min-height: 1.2em; text-align: center; font-weight: 800; font-size: .9rem; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M50 78 C38 68 22 66 10 70 L10 34 C22 30 38 32 50 42 Z" fill="#fff"/>
        <path d="M50 78 C62 68 78 66 90 70 L90 34 C78 30 62 32 50 42 Z" fill="#fff" fill-opacity=".85"/>
        <path d="M50 6 L55 19 L69 20 L58 29 L62 43 L50 35 L38 43 L42 29 L31 20 L45 19 Z" fill="#ffb38a"/>
      </svg>
    </div>

    <!-- LOGIN -->
    <section id="loginView">
      <h1>Welcome back</h1>
      <p class="sub">Log in with your registered mobile number.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="lMobile">Mobile number</label>
          <input id="lMobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel-national" required>
        </div>
        <div class="field">
          <label for="lPass">Password</label>
          <input id="lPass" type="date" required>
          <span class="hint">Your password is your date of birth.</span>
        </div>
        <div class="msg" id="lMsg" role="status" aria-live="polite"></div>
        <button class="primary" type="submit">Log in</button>
      </form>
      <p class="switch">New student? <a href="#signup" id="toSignup">Create account</a></p>
    </section>

    <!-- SIGN UP -->
    <section id="signupView" hidden>
      <h1>Create account</h1>
      <p class="sub">Fill in the student details to register.</p>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="sName">Student name</label>
          <input id="sName" type="text" placeholder="Full name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="sMobile">Mobile number</label>
          <input id="sMobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required>
        </div>
        <div class="field">
          <label for="sEmail">Gmail</label>
          <input id="sEmail" type="email" placeholder="name@gmail.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="sParent">Parent's name</label>
          <input id="sParent" type="text" placeholder="Parent or guardian name" required>
        </div>
        <div class="field">
          <label for="sClass">Class</label>
          <select id="sClass" required>
            <option value="">Select class</option>
            <option>6</option><option>7</option><option>8</option><option>9</option>
            <option>10</option><option>11</option><option>12</option><option>Dropper</option>
          </select>
        </div>
        <fieldset class="field subjects" id="sSubject" aria-describedby="subHint">
          <legend>Subjects</legend>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="subject" value="Maths"><span>Maths</span></label>
            <label class="chip"><input type="checkbox" name="subject" value="Science"><span>Science</span></label>
            <label class="chip"><input type="checkbox" name="subject" value="Physics"><span>Physics</span></label>
            <label class="chip"><input type="checkbox" name="subject" value="Chemistry"><span>Chemistry</span></label>
            <label class="chip"><input type="checkbox" name="subject" value="Biology"><span>Biology</span></label>
            <label class="chip"><input type="checkbox" name="subject" value="English"><span>English</span></label>
          </div>
          <span class="hint" id="subHint">Select one or more subjects.</span>
        </fieldset>
        <div class="field">
          <label for="sDob">Date of birth</label>
          <input id="sDob" type="date" required>
          <span class="hint">This will be your login password.</span>
        </div>
        <div class="msg" id="sMsg" role="status" aria-live="polite"></div>
        <button class="primary" type="submit">Create account</button>
      </form>
      <p class="switch">Already registered? <a href="#login" id="toLogin">Log in</a></p>
    </section>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 1) Paste your own config from Firebase Console > Project settings > Your apps > Web app
  const firebaseConfig = {
  apiKey: "AIzaSyDbxUTsBSeFIevnbJadEHkubyKBRHdDM94",
  authDomain: "geniusinstitute-unnao.firebaseapp.com",
  projectId: "geniusinstitute-unnao",
  storageBucket: "geniusinstitute-unnao.firebasestorage.app",
  messagingSenderId: "457602291145",
  appId: "1:457602291145:web:678518a46dd475dd540418",
  measurementId: "G-10RZJQMHR7"
  };
  const HOME_PAGE = "dashboard.html";
  const EMAIL_DOMAIN = "students.institute.app"; // internal only: mobile number becomes mobile@this-domain

  const configured = !firebaseConfig.apiKey.startsWith("YOUR_");
  let auth, db;
  if (configured) {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
  }

  const $ = (id) => document.getElementById(id);
  const loginView = $("loginView"), signupView = $("signupView");
  const toEmail = (mobile) => mobile + "@" + EMAIL_DOMAIN;

  function show(view) {
    const toSignup = view === "signup";
    signupView.hidden = !toSignup;
    loginView.hidden = toSignup;
    $("lMsg").textContent = $("sMsg").textContent = "";
    history.replaceState(null, "", toSignup ? "#signup" : "#login");
    (toSignup ? $("sName") : $("lMobile")).focus();
  }
  $("toSignup").addEventListener("click", (e) => { e.preventDefault(); show("signup"); });
  $("toLogin").addEventListener("click", (e) => { e.preventDefault(); show("login"); });
  if (location.hash === "#signup") { signupView.hidden = false; loginView.hidden = true; }

  ["lMobile", "sMobile"].forEach((id) => $(id).addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10);
  }));
  const today = new Date().toISOString().split("T")[0];
  $("sDob").max = today; $("lPass").max = today;

  function msg(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
  function mark(fields, bad) { fields.forEach((f) => f.setAttribute("aria-invalid", bad.includes(f))); }
  function busy(form, on, label) {
    const b = form.querySelector("button.primary");
    b.disabled = on; b.style.opacity = on ? .7 : 1;
    b.textContent = on ? "Please wait…" : label;
  }
  const NOT_SET = "Firebase is not set up yet. Add your config in the script of login.html.";

  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const f = { name: $("sName"), mobile: $("sMobile"), email: $("sEmail"), parent: $("sParent"),
                cls: $("sClass"), subject: $("sSubject"), dob: $("sDob") };
    const all = Object.values(f);
    const subjects = [...f.subject.querySelectorAll("input:checked")].map((c) => c.value);
    const bad = all.filter((el) => el !== f.subject && !el.value.trim());
    if (!subjects.length) bad.push(f.subject);
    if (f.mobile.value && !/^[6-9]\d{9}$/.test(f.mobile.value)) bad.push(f.mobile);
    if (f.email.value && !/^[^\s@]+@gmail\.com$/i.test(f.email.value.trim())) bad.push(f.email);
    mark(all, bad);
    if (bad.length) {
      const first = bad[0];
      msg($("sMsg"), first === f.mobile ? "Enter a valid 10-digit mobile number."
        : first === f.email ? "Enter a valid Gmail address."
        : first === f.subject && bad.length === 1 ? "Select at least one subject." : "Fill in all fields.", false);
      (first === f.subject ? f.subject.querySelector("input") : first).focus(); return;
    }
    if (!configured) { msg($("sMsg"), NOT_SET, false); return; }

    busy(form, true, "Create account");
    let cred;
    try {
      // Login account: mobile number + date of birth as password
      cred = await createUserWithEmailAndPassword(auth, toEmail(f.mobile.value), f.dob.value);
      // Student details saved in Firestore
      await setDoc(doc(db, "students", cred.user.uid), {
        name: f.name.value.trim(),
        mobile: f.mobile.value,
        gmail: f.email.value.trim().toLowerCase(),
        parentName: f.parent.value.trim(),
        class: f.cls.value,
        subjects: subjects,
        dob: f.dob.value,
        createdAt: serverTimestamp()
      });
      await signOut(auth);
      const m = f.mobile.value;
      msg($("sMsg"), "Account created. Taking you to login…", true);
      setTimeout(() => { form.reset(); busy(form, false, "Create account"); show("login"); $("lMobile").value = m; $("lPass").focus(); }, 1200);
    } catch (err) {
      if (cred && cred.user) { try { await deleteUser(cred.user); } catch (x) {} } // avoid half-created account
      const map = {
        "auth/email-already-in-use": "This mobile number is already registered. Log in instead.",
        "auth/operation-not-allowed": "Email/Password sign-in is not enabled in Firebase Authentication.",
        "auth/network-request-failed": "No internet connection. Check your network and try again.",
        "permission-denied": "Firestore rules blocked saving. Check your security rules."
      };
      if (err.code === "auth/email-already-in-use") mark(all, [f.mobile]);
      msg($("sMsg"), map[err.code] || "Could not create the account. Try again.", false);
      busy(form, false, "Create account");
    }
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target, m = $("lMobile"), p = $("lPass");
    if (!/^[6-9]\d{9}$/.test(m.value) || !p.value) {
      mark([m, p], [!/^[6-9]\d{9}$/.test(m.value) ? m : p]);
      msg($("lMsg"), "Enter your mobile number and date of birth.", false); return;
    }
    if (!configured) { msg($("lMsg"), NOT_SET, false); return; }
    busy(form, true, "Log in");
    try {
      const cred = await signInWithEmailAndPassword(auth, toEmail(m.value), p.value);
      mark([m, p], []);
      let name = "";
      try { const snap = await getDoc(doc(db, "students", cred.user.uid)); if (snap.exists()) name = snap.data().name; } catch (x) {}
      msg($("lMsg"), "Welcome" + (name ? ", " + name : "") + "!", true);
      if (HOME_PAGE) setTimeout(() => { location.href = HOME_PAGE; }, 800);
    } catch (err) {
      const map = {
        "auth/invalid-credential": "Mobile number or date of birth is wrong. Create an account if you are new.",
        "auth/user-not-found": "This mobile number is not registered. Create an account first.",
        "auth/wrong-password": "Wrong date of birth. Try again.",
        "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
        "auth/network-request-failed": "No internet connection. Check your network and try again."
      };
      mark([m, p], [m, p]);
      msg($("lMsg"), map[err.code] || "Could not log in. Try again.", false);
    }
    busy(form, false, "Log in");
  });
</script>
</body>
</html>
