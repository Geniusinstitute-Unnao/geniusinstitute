<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<style>
  :root {
    --bg: #e6e9fb;
    --clay: #7c8cff;
    --clay-light: #a9b4ff;
    --clay-dark: #5566e0;
    --accent: #ffb38a;
    --text: #2d3270;
    --muted: #6a70a8;
    --ok: #2e9e6b;
    --warn: #d9455f;
    --shadow-dark: rgba(85, 102, 224, .38);
    --shadow-light: rgba(255, 255, 255, .95);
    --glass: rgba(255, 255, 255, .38);
    --glass-border: rgba(255, 255, 255, .7);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d2040;
      --clay: #6f7fff;
      --clay-light: #9aa6ff;
      --clay-dark: #3b49b8;
      --accent: #ff9f72;
      --text: #e8ebff;
      --muted: #a3a9e0;
      --ok: #5fd9a0;
      --warn: #ff7a90;
      --shadow-dark: rgba(8, 10, 35, .7);
      --shadow-light: rgba(120, 135, 255, .22);
      --glass: rgba(40, 46, 100, .45);
      --glass-border: rgba(255, 255, 255, .18);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 130px max(16px, env(safe-area-inset-left));
    overflow-x: hidden;
  }
  .blob { position: fixed; border-radius: 50%; background: var(--clay-light); opacity: .85; pointer-events: none;
    box-shadow: inset -12px -12px 24px var(--shadow-dark), inset 12px 12px 24px var(--shadow-light); }
  .b1 { width: 22vmin; height: 22vmin; top: 12%; right: -4vmin; }
  .b2 { width: 14vmin; height: 14vmin; bottom: 22%; left: -3vmin; background: var(--accent); }
  .b3 { width: 9vmin; height: 9vmin; top: 46%; right: 12%; }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }

  /* clay surfaces */
  .clay {
    background: var(--bg); border-radius: 28px; padding: clamp(16px, 4vw, 24px);
    box-shadow: 12px 14px 28px var(--shadow-dark), -10px -10px 22px var(--shadow-light),
                inset 3px 3px 8px var(--shadow-light), inset -3px -3px 8px rgba(85,102,224,.1);
  }
  .inset { background: var(--bg); border-radius: 18px; box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); }

  /* header */
  header { display: flex; align-items: center; gap: 14px; }
  .badge { flex: none; width: 58px; height: 58px; border-radius: 32%;
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: 7px 9px 16px var(--shadow-dark), -5px -5px 12px var(--shadow-light), inset -4px -5px 9px var(--clay-dark), inset 4px 5px 9px rgba(255,255,255,.45);
    display: grid; place-items: center; }
  .badge svg { width: 56%; height: 56%; filter: drop-shadow(2px 3px 2px rgba(40,50,140,.45)); }
  header h1 { font-size: clamp(1.2rem, 4.6vw, 1.6rem); font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
  header p { color: var(--muted); font-size: .9rem; font-weight: 700; }

  h2 { font-size: 1.15rem; font-weight: 900; margin-bottom: 14px; }
  .sub { color: var(--muted); font-size: .88rem; font-weight: 700; }
  [hidden] { display: none !important; }
  .panel { animation: rise .45s cubic-bezier(.34, 1.56, .64, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* pills & chips */
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { font: inherit; font-weight: 800; font-size: .9rem; color: var(--text); border: 0; cursor: pointer; min-height: 44px; padding: 8px 16px; border-radius: 16px; background: var(--bg);
    box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); transition: box-shadow .2s, background .2s; }
  .pill[aria-pressed="true"] { color: #fff; text-shadow: 1px 1px 2px rgba(40,50,140,.5); background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: inset 4px 4px 8px var(--clay-dark), inset -3px -3px 8px rgba(255,255,255,.35); }
  .tag { display: inline-block; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: .8rem; background: var(--bg);
    box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light); }
  .tag.paid { color: var(--ok); } .tag.due { color: var(--warn); } .tag.upcoming { color: var(--muted); }

  /* lists */
  .list { display: grid; gap: 14px; margin-top: 16px; list-style: none; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 20px; background: var(--bg);
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); }
  .item .grow { flex: 1; min-width: 0; }
  .item b { display: block; font-weight: 900; overflow-wrap: anywhere; }
  .time { flex: none; min-width: 92px; font-weight: 900; font-size: .85rem; color: var(--clay-dark); }
  @media (prefers-color-scheme: dark) { .time { color: var(--clay-light); } }
  button.item { font: inherit; color: inherit; text-align: left; border: 0; width: 100%; cursor: pointer; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,179,138,.3); }
  .read .dot { background: transparent; box-shadow: inset 2px 2px 3px var(--shadow-dark), inset -2px -2px 3px var(--shadow-light); }
  .read b { font-weight: 700; color: var(--muted); }

  /* fee */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 4px 0 18px; }
  .stat { padding: 12px 8px; text-align: center; }
  .stat span { display: block; color: var(--muted); font-weight: 800; font-size: .75rem; }
  .stat b { font-size: clamp(.95rem, 3.6vw, 1.2rem); font-weight: 900; }
  .track { height: 20px; padding: 4px; }
  .bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--clay-light), var(--clay)); min-width: 6px; transition: width .8s cubic-bezier(.34, 1.2, .64, 1);
    box-shadow: 1px 1px 4px var(--shadow-dark), inset 1px 1px 3px rgba(255,255,255,.5); }

  /* profile */
  .avatar { width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 34%; display: grid; place-items: center; font-size: 2.2rem; font-weight: 900; color: #fff;
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: 8px 10px 18px var(--shadow-dark), -6px -6px 14px var(--shadow-light), inset -5px -6px 10px var(--clay-dark), inset 5px 6px 10px rgba(255,255,255,.45); text-shadow: 2px 2px 3px rgba(40,50,140,.5); }
  .center { text-align: center; }
  dl { display: grid; gap: 12px; margin-top: 18px; }
  dl > div { padding: 12px 16px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  dt { color: var(--muted); font-weight: 800; font-size: .85rem; }
  dd { font-weight: 900; overflow-wrap: anywhere; text-align: right; }
  .logout { margin-top: 18px; width: 100%; font: inherit; font-weight: 900; font-size: 1rem; color: #fff; border: 0; cursor: pointer; border-radius: 20px; min-height: 50px;
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: 7px 9px 16px var(--shadow-dark), -5px -5px 12px var(--shadow-light), inset -4px -5px 9px var(--clay-dark), inset 4px 5px 9px rgba(255,255,255,.4); text-shadow: 1px 2px 2px rgba(40,50,140,.5); }
  .logout:active { transform: translateY(1px); }

  /* rank */
  .rankcard { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .rankno { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; text-align: center; color: #fff; font-weight: 900;
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: 8px 10px 18px var(--shadow-dark), -6px -6px 14px var(--shadow-light), inset -6px -7px 12px var(--clay-dark), inset 6px 7px 12px rgba(255,255,255,.45); text-shadow: 1px 2px 3px rgba(40,50,140,.5); }
  .rankno b { font-size: 2.1rem; line-height: 1; display: block; }
  .rankno small { font-size: .7rem; font-weight: 800; }
  .chart { display: flex; align-items: flex-end; gap: 12px; height: 150px; padding: 16px 14px 10px; margin-top: 16px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; font-size: .75rem; font-weight: 800; }
  .col i { width: 100%; max-width: 38px; border-radius: 10px 10px 6px 6px; background: linear-gradient(180deg, var(--clay-light), var(--clay)); box-shadow: 2px 3px 6px var(--shadow-dark), inset 1px 2px 3px rgba(255,255,255,.5); }
  .col:last-child i { background: linear-gradient(180deg, var(--accent), #ff8a5c); }
  .me { outline: 2px solid var(--clay); }
  .pos { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; font-weight: 900; }

  /* glass navigation */
  nav.glass {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom));
    width: min(94vw, 580px); display: flex; justify-content: space-between; gap: 4px; padding: 8px; border-radius: 30px;
    background: var(--glass); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
    box-shadow: 10px 14px 30px var(--shadow-dark), inset 0 1px 0 rgba(255,255,255,.6);
  }
  nav.glass button { position: relative; flex: 1; min-width: 0; min-height: 58px; font: inherit; font-weight: 800; font-size: .68rem; color: var(--text);
    border: 0; background: transparent; cursor: pointer; border-radius: 22px; display: grid; place-items: center; align-content: center; gap: 3px; transition: background .25s, color .25s, box-shadow .25s; }
  nav.glass button svg { width: 24px; height: 24px; }
  nav.glass button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.glass button[aria-current="page"] { color: #fff; text-shadow: 1px 1px 2px rgba(40,50,140,.5);
    background: linear-gradient(145deg, var(--clay-light), var(--clay));
    box-shadow: inset 3px 3px 7px var(--clay-dark), inset -2px -2px 6px rgba(255,255,255,.35), 3px 4px 10px var(--shadow-dark); }
  nav.glass .count { position: absolute; top: 4px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #3a2418;
    font-size: .66rem; font-weight: 900; display: grid; place-items: center; box-shadow: 1px 2px 4px rgba(0,0,0,.25); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  @media (max-width: 380px) { nav.glass button { font-size: .6rem; } nav.glass button svg { width: 21px; height: 21px; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="wrap">
    <header class="clay">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M50 78 C38 68 22 66 10 70 L10 34 C22 30 38 32 50 42 Z" fill="#fff"/>
          <path d="M50 78 C62 68 78 66 90 70 L90 34 C78 30 62 32 50 42 Z" fill="#fff" fill-opacity=".85"/>
          <path d="M50 6 L55 19 L69 20 L58 29 L62 43 L50 35 L38 43 L42 29 L31 20 L45 19 Z" fill="#ffb38a"/>
        </svg>
      </div>
      <div>
        <h1 id="hello">Hello</h1>
        <p id="subline">Your Institute Name</p>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <nav class="glass" id="nav" aria-label="Main"></nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Use the SAME config as login.html
  const firebaseConfig = {
  apiKey: "AIzaSyDbxUTsBSeFIevnbJadEHkubyKBRHdDM94",
  authDomain: "geniusinstitute-unnao.firebaseapp.com",
  projectId: "geniusinstitute-unnao",
  storageBucket: "geniusinstitute-unnao.firebasestorage.app",
  messagingSenderId: "457602291145",
  appId: "1:457602291145:web:678518a46dd475dd540418",
  measurementId: "G-10RZJQMHR7"
  };
  const INSTITUTE = "Your Institute Name";
  const configured = !firebaseConfig.apiKey.startsWith("YOUR_");

  /* ---------- Sample data: replace with your own (or load from Firestore) ---------- */
  const DEMO_STUDENT = { name: "Demo Student", mobile: "9876543210", gmail: "demo@gmail.com", parentName: "Demo Parent",
                         class: "10", subjects: ["Maths", "Physics", "Chemistry"], dob: "2010-05-14" };
  const TIMETABLE = {
    Mon: [["4:00 – 5:00 PM", "Maths", "Mr. Sharma", "Room 1"], ["5:00 – 6:00 PM", "Physics", "Ms. Verma", "Room 2"]],
    Tue: [["4:00 – 5:00 PM", "Chemistry", "Mr. Singh", "Room 2"], ["5:00 – 6:00 PM", "English", "Ms. Gupta", "Room 3"]],
    Wed: [["4:00 – 5:00 PM", "Science", "Ms. Rao", "Room 1"], ["5:00 – 6:00 PM", "Biology", "Mr. Khan", "Lab"]],
    Thu: [["4:00 – 5:00 PM", "Maths", "Mr. Sharma", "Room 1"], ["5:00 – 6:00 PM", "Chemistry", "Mr. Singh", "Room 2"]],
    Fri: [["4:00 – 5:00 PM", "Physics", "Ms. Verma", "Room 2"], ["5:00 – 6:00 PM", "English", "Ms. Gupta", "Room 3"]],
    Sat: [["10:00 – 11:00 AM", "Biology", "Mr. Khan", "Lab"], ["11:00 AM – 12:00 PM", "Science", "Ms. Rao", "Room 1"]]
  };
  const FEE = [
    { label: "Admission fee", amount: 6000, status: "paid", note: "Paid on 05 Jul 2026" },
    { label: "Installment 2", amount: 6000, status: "paid", note: "Paid on 05 Sep 2026" },
    { label: "Installment 3", amount: 6000, status: "due", note: "Due 10 Nov 2026" },
    { label: "Installment 4", amount: 6000, status: "upcoming", note: "Due 10 Jan 2027" }
  ];
  let NOTES = [
    { id: 1, title: "Unit test on Monday", body: "Maths and Physics unit test starts at 4 PM. Bring your geometry box.", time: "Today", unread: true },
    { id: 2, title: "Fee reminder", body: "Installment 3 is due on 10 Nov 2026.", time: "Yesterday", unread: true },
    { id: 3, title: "Holiday notice", body: "The institute will remain closed on Diwali. Classes resume the next day.", time: "3 days ago", unread: false }
  ];
  const RANK = { rank: 7, of: 42, tests: [["T1", 62], ["T2", 70], ["T3", 66], ["T4", 78], ["T5", 84]],
    top: [["Aarav K.", 92], ["Isha M.", 90], ["Riya S.", 88]] };

  /* ---------- helpers ---------- */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inr = (n) => "₹" + Number(n).toLocaleString("en-IN");
  const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const TABS = [
    { id: "timetable", label: "Time table", svg: icon('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>') },
    { id: "fee", label: "Fee", svg: icon('<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>') },
    { id: "notify", label: "Alerts", full: "Notifications", svg: icon('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>') },
    { id: "profile", label: "Profile", full: "Your profile", svg: icon('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>') },
    { id: "rank", label: "Rank", svg: icon('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>') }
  ];

  let student = DEMO_STUDENT, auth, current = "timetable";
  const days = Object.keys(TIMETABLE);
  let day = days[(new Date().getDay() + 6) % 7] || "Mon"; // today, Sunday falls back to Mon
  if (!TIMETABLE[day]) day = "Mon";

  /* ---------- views ---------- */
  const views = {
    timetable() {
      const mine = student.subjects || [];
      const rows = (TIMETABLE[day] || []).filter((r) => mine.includes(r[1]));
      return `<section class="clay panel"><h2>Time table</h2>
        <div class="row" role="group" aria-label="Choose day">${days.map((d) => `<button class="pill" data-day="${d}" aria-pressed="${d === day}">${d}</button>`).join("")}</div>
        <ul class="list">${rows.length ? rows.map((r) => `<li class="item"><span class="time">${esc(r[0])}</span><span class="grow"><b>${esc(r[1])}</b><span class="sub">${esc(r[2])} · ${esc(r[3])}</span></span></li>`).join("")
          : `<li class="item"><span class="grow sub">No classes for your subjects on this day.</span></li>`}</ul></section>`;
    },
    fee() {
      const total = FEE.reduce((a, f) => a + f.amount, 0), paid = FEE.filter((f) => f.status === "paid").reduce((a, f) => a + f.amount, 0);
      const pct = Math.round((paid / total) * 100);
      return `<section class="clay panel"><h2>Fee</h2>
        <div class="stats"><div class="inset stat"><span>Total</span><b>${inr(total)}</b></div><div class="inset stat"><span>Paid</span><b>${inr(paid)}</b></div><div class="inset stat"><span>Due</span><b>${inr(total - paid)}</b></div></div>
        <div class="inset track" role="progressbar" aria-label="Fee paid" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="feeBar" style="width:0"></div></div>
        <p class="sub" style="margin-top:8px">${pct}% paid</p>
        <ul class="list">${FEE.map((f) => `<li class="item"><span class="grow"><b>${esc(f.label)}</b><span class="sub">${esc(f.note)}</span></span><span style="text-align:right"><b>${inr(f.amount)}</b><span class="tag ${f.status}">${f.status === "paid" ? "Paid" : f.status === "due" ? "Due" : "Upcoming"}</span></span></li>`).join("")}</ul></section>`;
    },
    notify() {
      return `<section class="clay panel"><h2>Notifications</h2><p class="sub">Tap a message to mark it as read.</p>
        <ul class="list">${NOTES.map((n) => `<li><button class="item ${n.unread ? "" : "read"}" data-note="${n.id}"><span class="dot" aria-hidden="true"></span><span class="grow"><b>${esc(n.title)}</b><span class="sub">${esc(n.body)}</span></span><span class="sub">${esc(n.time)}</span></button></li>`).join("")}</ul></section>`;
    },
    profile() {
      const s = student, initial = (s.name || "?").trim().charAt(0).toUpperCase();
      const dob = s.dob ? new Date(s.dob + "T00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "";
      const rowsData = [["Mobile", s.mobile], ["Gmail", s.gmail], ["Parent's name", s.parentName], ["Class", s.class], ["Subjects", (s.subjects || []).join(", ")], ["Date of birth", dob]];
      return `<section class="clay panel"><div class="center"><div class="avatar" aria-hidden="true">${esc(initial)}</div><h2 style="margin:0">${esc(s.name)}</h2><p class="sub">Class ${esc(s.class)}</p></div>
        <dl>${rowsData.map(([k, v]) => `<div class="inset"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        <button class="logout" id="logout">Log out</button></section>`;
    },
    rank() {
      const max = Math.max(...RANK.tests.map((t) => t[1]), 100), r = RANK;
      const pct = Math.round(((r.of - r.rank) / r.of) * 100);
      return `<section class="clay panel"><h2>Your rank</h2>
        <div class="rankcard"><div class="rankno"><div><b>#${r.rank}</b><small>of ${r.of}</small></div></div>
          <div><b style="font-size:1.1rem">Ahead of ${pct}% of students</b><p class="sub">Based on your last ${r.tests.length} tests.</p></div></div>
        <div class="inset chart" role="img" aria-label="Test scores: ${r.tests.map((t) => t[0] + " " + t[1]).join(", ")}">${r.tests.map((t) => `<div class="col">${t[1]}<i style="height:${(t[1] / max) * 100}%"></i>${t[0]}</div>`).join("")}</div>
        <h2 style="margin-top:22px">Top scorers</h2>
        <ul class="list">${r.top.map((t, i) => `<li class="item"><span class="pos inset">${i + 1}</span><span class="grow"><b>${esc(t[0])}</b></span><b>${t[1]}</b></li>`).join("")}</ul></section>`;
    }
  };

  /* ---------- rendering ---------- */
  function renderNav() {
    const unread = NOTES.filter((n) => n.unread).length;
    $("#nav").innerHTML = TABS.map((t) => `<button data-tab="${t.id}" ${t.id === current ? 'aria-current="page"' : ""} aria-label="${t.full || t.label}">${t.svg}<span>${t.label}</span>${t.id === "notify" && unread ? `<i class="count" aria-label="${unread} unread">${unread}</i>` : ""}</button>`).join("");
  }
  function render() {
    $("#view").innerHTML = views[current]();
    renderNav();
    if (current === "fee") {
      const total = FEE.reduce((a, f) => a + f.amount, 0), paid = FEE.filter((f) => f.status === "paid").reduce((a, f) => a + f.amount, 0);
      requestAnimationFrame(() => requestAnimationFrame(() => { const b = $("#feeBar"); if (b) b.style.width = Math.round((paid / total) * 100) + "%"; }));
    }
  }
  function go(tab) {
    current = views[tab] ? tab : "timetable";
    history.replaceState(null, "", "#" + current);
    render(); window.scrollTo({ top: 0 });
  }

  $("#nav").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
  $("#view").addEventListener("click", async (e) => {
    const d = e.target.closest("[data-day]"); if (d) { day = d.dataset.day; render(); return; }
    const n = e.target.closest("[data-note]");
    if (n) { const note = NOTES.find((x) => x.id == n.dataset.note); if (note) { note.unread = false; render(); } return; }
    if (e.target.closest("#logout")) { try { if (auth) await signOut(auth); } catch (x) {} location.href = "login.html"; }
  });

  function start(s) {
    student = s;
    $("#hello").textContent = "Hello, " + (s.name || "student").split(" ")[0];
    $("#subline").textContent = INSTITUTE;
    const h = location.hash.slice(1);
    current = views[h] ? h : "timetable";
    render();
  }

  if (configured) {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    const db = getFirestore(app);
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      let data = { name: "Student", subjects: [] };
      try { const snap = await getDoc(doc(db, "students", user.uid)); if (snap.exists()) data = snap.data(); } catch (x) {}
      start(data);
    });
  } else {
    start(DEMO_STUDENT); // preview mode until Firebase is configured
  }
</script>
</body>
</html>
